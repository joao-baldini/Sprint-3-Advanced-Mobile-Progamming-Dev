# ==========================================
# SPI Alert API - Configurações da Aplicação
# ==========================================

# Porta do servidor
server.port=8080

# ==========================================
# Banco de dados H2 em modo FILE
# Os dados persistem após reinicialização
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/spidb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2 (acesso via browser: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
